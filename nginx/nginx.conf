worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    
    sendfile        on;
    keepalive_timeout  65;

    # Upstream for backend API
    upstream backend_api {
        server backend:8000;
    }

    # Upstream for frontend React App
    upstream frontend_app {
        server frontend:80;
    }

    # HTTP to HTTPS redirect
    server {
        listen 80;
        server_name _; # Replace with actual domain name

        # Allow Let's Encrypt to verify domain ownership
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect all other HTTP requests to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS server
    server {
        listen 443 ssl;
        server_name _; # Replace with actual domain name

        # SSL Configuration (Replace paths with actual domain paths generated by Certbot)
        # ssl_certificate /etc/letsencrypt/live/domain.com/fullchain.pem;
        # ssl_certificate_key /etc/letsencrypt/live/domain.com/privkey.pem;
        
        # Use self-signed or dummy certs if testing locally without a domain
        # To test locally without certs, comment out the SSL block and change listen 443 to listen 80

        # API Proxy
        location /api/ {
            proxy_pass http://backend_api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Allow large file uploads for documents
            client_max_body_size 20M;
        }

        # Frontend Static Files (or proxy to Node)
        location / {
            proxy_pass http://frontend_app/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
