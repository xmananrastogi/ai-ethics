[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["thoa_screening"]

[project]
name = "thoa-screening"
version = "0.1.0"
description = "AI-assisted compliance screening for India's THOA"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0,<3.0",
    "opencv-python-headless>=4.8",
    "pytesseract>=0.3",
    "pdf2image>=1.16",
    "spacy>=3.7",
    "Pillow>=10.0",
    "fastapi>=0.100",
    "python-multipart>=0.0.6",
    "celery>=5.3",
    "redis>=5.0",
    "reportlab>=4.0"
]

[project.optional-dependencies]
db = [
    "sqlalchemy>=2.0,<3.0",
    "psycopg2-binary>=2.9",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn>=0.23",
    "httpx>=0.24"
]

[tool.pytest.ini_options]
testpaths = ["thoa_screening/tests"]
python_files = ["__init__.py", "test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
target-version = "py311"
line-length = 88
